  <span class=kw>return</span> () => <span class=kw>this</span>.listeners.<span class=fn>delete</span>(listener);
}

<span class=fn>setState</span>(updates) {
  <span class=kw>this</span>.state = { ...<span class=kw>this</span>.state, ...updates };
  <span class=kw>const</span> changed = Object.<span class=fn>keys</span>(updates);
  <span class=kw>this</span>.listeners.<span class=fn>forEach</span>(fn => <span class=fn>fn</span>(<span class=kw>this</span>.state, changed));
}`
          },

<span class=kw>const</span> dpr  = window.devicePixelRatio || 1;
<span class=kw>const</span> rect = canvas.<span class=fn>getBoundingClientRect</span>();

canvas.width  = rect.width  * dpr;
canvas.height = rect.height * dpr;
ctx.<span class=fn>scale</span>(dpr, dpr); <span class=cm>// Crisp on any display</span>
ctx.<span class=fn>clearRect</span>(0, 0, rect.width, rect.height);`

        rewrite: p => p.<span class=fn>replace</span>(<span class=str>/^\/api\/railradar/</span>, <span class=str>''</span>)
      }
    }
  }
});`

      const data = slidesData[index];
      const screen = document.getElementById("slideScreen");

      if (data.isTitle) {

            <div class="details-row">
              <div class="info-card">
                <h4>Presented To</h4>

              <div class="info-card">

      } else if (data.isCode) {
        let codeCardsHtml = '';

        screen.innerHTML = `

          </div>
          <div class="slide-content">

              ${codeCardsHtml}
            </div>
          </div>
          <div class="slide-footer">
            <span>Poornima College of Engineering, Jaipur • Dept. of IT</span>
            <span>Slide ${index + 1} of ${slidesData.length}</span>
          </div>
        `;
      } else {
        const gridClass = data.cards.length === 3 || data.cards.length === 6 ? 'grid-3' : 'grid-2';
        
        let cardsHtml = '';
        data.cards.forEach(c => {
          let bulletsHtml = c.bullets.map(b => `<li>${b}</li>`).join('');
          cardsHtml += `
            <div class="card">
              <div class="card-title">📌 ${c.title}</div>
              <ul class="bullet-list">${bulletsHtml}</ul>
            </div>
          `;
        });

        screen.innerHTML = `
          <div class="slide-header">

            </div>
          </div>
          <div class="slide-footer">
            <span>Poornima College of Engineering, Jaipur • Dept. of IT</span>
            <span>Slide ${index + 1} of ${slidesData.length}</span>
          </div>
        `;
      }

      document.getElementById("slideNum").textContent = `Slide ${index + 1} / ${slidesData.length}`;
      document.getElementById("prevBtn").disabled = (index === 0);
      document.getElementById("nextBtn").disabled = (index === slidesData.length - 1);
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderSlide(currentSlide);
      }
    }

    function nextSlide() {
      if (currentSlide < slidesData.length - 1) {
        currentSlide++;
        renderSlide(currentSlide);
      }
    }

    // Keyboard navigation
    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft" || e.key === "PageUp") {
        prevSlide();
      } else if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") {
        nextSlide();
      }
    });

    // Initialize first slide
    renderSlide(0);
  </script>
