<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover for iOS notch/home-indicator safe areas -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1e40af" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="RailGaadi — Live India train tracking. Running status, route maps, analytics, weather for all Indian trains." />

    <!-- PWA / Mobile Web App -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RailGaadi" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="https://images.unsplash.com/photo-1532103054090-a33923a7c120?w=180&h=180&fit=crop" />

    <title>RailGaadi — Live India Train Tracker</title>

    <!-- Preconnect to critical third-party origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.maptiler.com" crossorigin />
    <link rel="preconnect" href="https://railradar.in" crossorigin />
    <link rel="preconnect" href="https://api.openweathermap.org" crossorigin />
    <link rel="dns-prefetch" href="https://unpkg.com" />

    <!-- Typography — slimmed weight list, font-display=swap prevents FOIT on slow 4G -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />

    <!-- MapLibre GL CSS -->
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.1.0/dist/maplibre-gl.css" />

    <!-- RailGaadi Modular Design System -->
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/map.css" />
    <link rel="stylesheet" href="css/analytics.css" />
    <link rel="stylesheet" href="css/companion.css" />
    <link rel="stylesheet" href="css/phase2.css" />
    <!-- Mobile-first overrides — loaded last so they take priority -->
    <link rel="stylesheet" href="css/mobile.css" />

    <!-- MapLibre GL JS — defer so it doesn't block first paint -->
    <script src="https://unpkg.com/maplibre-gl@5.1.0/dist/maplibre-gl.js" defer></script>
  </head>
  <body>
    <div id="root"></div>

    <!-- Application Script (ES Module) -->
    <script type="module" src="js/app.js"></script>
  </body>
</html>
