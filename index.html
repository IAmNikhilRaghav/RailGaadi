<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover for iOS notch/home-indicator safe areas -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1e40af" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="RailGaadi — Live India train tracking. Running status, route maps, analytics, weather for all Indian trains." />

    <!-- PWA / Mobile Web App -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RailGaadi" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="https://images.unsplash.com/photo-1532103054090-a33923a7c120?w=180&h=180&fit=crop" />

    <title>RailGaadi — Live India Train Tracker</title>

    <!-- Preconnect to critical third-party origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.maptiler.com" crossorigin />
    <link rel="preconnect" href="https://railradar.in" crossorigin />
    <link rel="preconnect" href="https://api.openweathermap.org" crossorigin />
    <link rel="dns-prefetch" href="https://unpkg.com" />

    <!-- Typography — slimmed weight list, font-display=swap prevents FOIT on slow 4G -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />

    <!-- MapLibre GL CSS -->
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.1.0/dist/maplibre-gl.css" />

    <!-- RailGaadi Modular Design System -->
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/map.css" />
    <link rel="stylesheet" href="css/analytics.css" />
    <link rel="stylesheet" href="css/companion.css" />
    <link rel="stylesheet" href="css/phase2.css" />
    <link rel="stylesheet" href="css/routesearch.css" />
    <!-- Mobile-first overrides — loaded last so they take priority -->
    <link rel="stylesheet" href="css/mobile.css" />

    <!-- MapLibre GL JS -->
    <script src="https://unpkg.com/maplibre-gl@5.1.0/dist/maplibre-gl.js"></script>
  </head>
  <body>
    <div id="root">
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#0f172a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;text-align:center;padding:20px;">
        <div style="width:64px;height:64px;border-radius:18px;background:#2563eb;display:flex;align-items:center;justify-content:center;margin-bottom:18px;box-shadow:0 8px 24px rgba(37,99,235,0.4);">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="16" height="16" x="4" y="3" rx="2"/>
            <path d="M4 11h16"/><path d="M12 3v8"/><path d="m8 19-2 3"/><path d="m18 22-2-3"/><circle cx="8" cy="15" r="1"/><circle cx="16" cy="15" r="1"/>
          </svg>
        </div>
        <h2 style="font-size:22px;font-weight:700;margin-bottom:6px;letter-spacing:-0.02em;">RailGaadi</h2>
        <p style="font-size:13px;color:#94a3b8;margin-bottom:20px;">Connecting to Indian Railways Network…</p>
        <div style="width:36px;height:36px;border:3px solid rgba(255,255,255,0.15);border-top-color:#38bdf8;border-radius:50%;animation:rgSpin 0.8s linear infinite;"></div>
        <style>@keyframes rgSpin{to{transform:rotate(360deg)}}</style>
      </div>
    </div>

    <!-- Application Script (ES Module) -->
    <script type="module" src="js/app.js"></script>
  </body>
</html>
